<script>
(() => {
  let isPlaying = false;
  let tempo = 120;
  let beatsPerMeasure = 4;
  let currentBeat = 0;
  let timerId = null;
  let tapTimestamps = [];
  let currentSound = 'woodblock';
  let subdivision = 1;

  // DOM Elements
  const bpmDisplay = document.getElementById('bpm-display');
  const bpmSlider = document.getElementById('bpm-slider');
  const tempoMarkingText = document.getElementById('tempo-marking-text');
  const pendulumArm = document.getElementById('pendulum-arm');
  const tempoArcTrack = document.getElementById('tempo-arc-track');
  const ambientGlow = document.getElementById('ambient-glow');
  const playBtn = document.getElementById('toggle-play-btn');
  const playSvg = document.getElementById('play-svg');
  const stopSvg = document.getElementById('stop-svg');
  const playBtnLabel = document.getElementById('play-btn-label');
  const pipsContainer = document.getElementById('beat-pips-container');
  const tapTempoBtn = document.getElementById('tap-tempo-btn');
  const tapHint = document.getElementById('tap-hint');
  const signatureLabel = document.getElementById('current-signature-label');
  const subdivLabel = document.getElementById('subdivision-label');

  // Web Audio Context for realistic crisp metronome clicks
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playClick(isAccent) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    let freq = isAccent ? 1200 : 800;
    let decay = 0.04;

    if (currentSound === 'woodblock') {
      freq = isAccent ? 1040 : 760;
      decay = 0.05;
      osc.type = 'sine';
    } else if (currentSound === 'beep') {
      freq = isAccent ? 1760 : 880;
      decay = 0.06;
      osc.type = 'triangle';
    } else if (currentSound === 'rimshot') {
      freq = isAccent ? 600 : 420;
      decay = 0.03;
      osc.type = 'square';
    } else if (currentSound === 'cowbell') {
      freq = isAccent ? 800 : 540;
      decay = 0.09;
      osc.type = 'sawtooth';
    }

    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(isAccent ? 0.9 : 0.45, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + decay);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + decay + 0.01);
  }

  function getMarking(b) {
    if (b < 60) return "Largo";
    if (b < 76) return "Adagio";
    if (b < 108) return "Andante";
    if (b < 120) return "Moderato";
    if (b < 168) return "Allegro";
    if (b < 200) return "Presto";
    return "Prestissimo";
  }

  window.setTempo = function(val) {
    tempo = Math.max(40, Math.min(240, Number(val)));
    bpmDisplay.textContent = tempo;
    bpmSlider.value = tempo;
    tempoMarkingText.textContent = `${getMarking(tempo)} · ${tempo} BPM`;
    
    // Update Arc Stroke
    // Range is 40..240 -> offset 300 to 40
    const ratio = (tempo - 40) / (240 - 40);
    const offset = 300 - (ratio * 260);
    tempoArcTrack.style.strokeDashoffset = offset;

    if (isPlaying) {
      restartEngine();
    }
  };

  function updateBeatPipsUI() {
    pipsContainer.innerHTML = '';
    for (let i = 0; i < beatsPerMeasure; i++) {
      const isAccent = (i === 0);
      const pip = document.createElement('div');
      pip.className = `beat-pip relative flex items-center justify-center w-11 h-11 rounded-full bg-surface-container transition-all duration-75`;
      pip.dataset.beat = i;
      
      const text = document.createElement('span');
      text.className = `font-label-caption text-label-caption font-bold ${isAccent ? 'text-stage-crimson' : 'text-graphite-mute'}`;
      text.textContent = (i + 1);

      const ring = document.createElement('div');
      ring.className = `pip-ring absolute inset-0 rounded-full border-2 ${isAccent ? 'border-stage-crimson' : 'border-slate-hardware'} opacity-0 scale-95 transition-all duration-75`;

      pip.appendChild(text);
      pip.appendChild(ring);
      pipsContainer.appendChild(pip);
    }
  }

  function triggerBeatVisuals(beat) {
    const pips = pipsContainer.querySelectorAll('.beat-pip');
    pips.forEach((p, idx) => {
      const ring = p.querySelector('.pip-ring');
      if (idx === beat) {
        if (idx === 0) {
          p.classList.add('bg-stage-crimson', 'text-on-primary', 'shadow-md', 'shadow-stage-crimson/30');
          p.classList.remove('bg-surface-container');
          ambientGlow.classList.add('scale-125', 'opacity-100');
        } else {
          p.classList.add('bg-slate-hardware', 'text-on-primary');
          p.classList.remove('bg-surface-container');
        }
        if (ring) ring.classList.add('opacity-100', 'scale-110');
      } else {
        p.classList.remove('bg-stage-crimson', 'bg-slate-hardware', 'text-on-primary', 'shadow-md', 'shadow-stage-crimson/30');
        p.classList.add('bg-surface-container');
        if (ring) ring.classList.remove('opacity-100', 'scale-110');
      }
    });

    // Swing Pendulum
    const direction = (beat % 2 === 0) ? -28 : 28;
    pendulumArm.style.transform = `rotate(${direction}deg)`;
    setTimeout(() => {
      ambientGlow.classList.remove('scale-125', 'opacity-100');
    }, 120);
  }

  function step() {
    const isAccent = (currentBeat === 0);
    playClick(isAccent);
    triggerBeatVisuals(currentBeat);
    currentBeat = (currentBeat + 1) % beatsPerMeasure;
  }

  function startEngine() {
    initAudio();
    isPlaying = true;
    currentBeat = 0;
    playSvg.classList.add('hidden');
    stopSvg.classList.remove('hidden');
    playBtnLabel.textContent = 'Halt Stage';
    playBtn.classList.replace('from-stage-crimson', 'from-charcoal-hardware');
    playBtn.classList.replace('via-ember-scarlet', 'via-slate-hardware');
    playBtn.classList.replace('to-electric-orange', 'to-slate-hardware');

    const intervalMs = (60000 / tempo);
    step();
    timerId = setInterval(step, intervalMs);
  }

  function stopEngine() {
    isPlaying = false;
    clearInterval(timerId);
    timerId = null;
    currentBeat = 0;
    playSvg.classList.remove('hidden');
    stopSvg.classList.add('hidden');
    playBtnLabel.textContent = 'Start Rig';
    playBtn.classList.replace('from-charcoal-hardware', 'from-stage-crimson');
    playBtn.classList.replace('via-slate-hardware', 'via-ember-scarlet');
    playBtn.classList.replace('to-slate-hardware', 'to-electric-orange');

    pendulumArm.style.transform = `rotate(0deg)`;
    const pips = pipsContainer.querySelectorAll('.beat-pip');
    pips.forEach(p => {
      p.classList.remove('bg-stage-crimson', 'bg-slate-hardware', 'text-on-primary', 'shadow-md', 'shadow-stage-crimson/30');
      p.classList.add('bg-surface-container');
      const ring = p.querySelector('.pip-ring');
      if (ring) ring.classList.remove('opacity-100', 'scale-110');
    });
  }

  function restartEngine() {
    if (isPlaying) {
      clearInterval(timerId);
      const intervalMs = (60000 / tempo);
      timerId = setInterval(step, intervalMs);
    }
  }

  // Event Listeners
  playBtn.addEventListener('click', () => {
    if (isPlaying) {
      stopEngine();
    } else {
      startEngine();
    }
  });

  bpmSlider.addEventListener('input', (e) => {
    window.setTempo(e.target.value);
  });

  document.getElementById('btn-add-1').addEventListener('click', () => window.setTempo(tempo + 1));
  document.getElementById('btn-sub-1').addEventListener('click', () => window.setTempo(tempo - 1));
  document.getElementById('btn-add-5').addEventListener('click', () => window.setTempo(tempo + 5));
  document.getElementById('btn-sub-5').addEventListener('click', () => window.setTempo(tempo - 5));

  // Time Signature Switchers
  document.querySelectorAll('.ts-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ts-chip').forEach(c => {
        c.className = 'ts-chip py-space-xs rounded-xl bg-surface-container-low text-graphite-mute active:scale-95 transition-all font-title-base text-[13px] font-semibold';
      });
      btn.className = 'ts-chip py-space-xs rounded-xl bg-primary text-on-primary shadow-sm active:scale-95 transition-all font-title-base text-[13px] font-semibold';
      beatsPerMeasure = parseInt(btn.dataset.beats, 10);
      signatureLabel.textContent = `${btn.dataset.name} TIME`;
      currentBeat = 0;
      updateBeatPipsUI();
      if (isPlaying) restartEngine();
    });
  });

  // Sound Engine Presets
  document.querySelectorAll('.sound-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sound-chip').forEach(c => {
        c.className = 'sound-chip py-1.5 px-1 rounded-lg bg-surface-container-low text-graphite-mute font-label-caption text-[11px] font-medium text-center truncate transition-all active:scale-95';
      });
      btn.className = 'sound-chip py-1.5 px-1 rounded-lg bg-surface-container text-on-surface font-label-caption text-[11px] font-bold text-center truncate transition-all active:scale-95';
      currentSound = btn.dataset.sound;
      initAudio();
      playClick(true);
    });
  });

  // Subdivisions Selection
  document.querySelectorAll('.subdiv-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.subdiv-btn').forEach(b => {
        b.className = 'subdiv-btn flex flex-col items-center justify-center py-2.5 rounded-xl bg-surface-container-low text-graphite-mute transition-all active:scale-95';
      });
      btn.className = 'subdiv-btn active-subdiv flex flex-col items-center justify-center py-2.5 rounded-xl bg-surface-container text-on-surface transition-all active:scale-95';
      subdivision = parseInt(btn.dataset.sub, 10);
      subdivLabel.textContent = btn.dataset.title;
    });
  });

  // Tap Tempo calculation
  tapTempoBtn.addEventListener('click', () => {
    initAudio();
    const now = performance.now();
    tapTimestamps.push(now);
    
    // Purge entries older than 2.5s
    tapTimestamps = tapTimestamps.filter(t => now - t < 2500);

    if (tapTimestamps.length > 1) {
      let intervals = [];
      for (let i = 1; i < tapTimestamps.length; i++) {
        intervals.push(tapTimestamps[i] - tapTimestamps[i - 1]);
      }
      const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      const computedBpm = Math.round(60000 / avgInterval);
      if (computedBpm >= 40 && computedBpm <= 240) {
        window.setTempo(computedBpm);
        tapHint.textContent = `${computedBpm} BPM detected`;
        tapHint.classList.add('text-stage-crimson');
      }
    } else {
      tapHint.textContent = 'Keep tapping...';
      tapHint.classList.remove('text-stage-crimson');
    }

    // Play quick audition click
    playClick(true);
  });

  // Initial Sync
  window.setTempo(120);
})();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-nav-glass backdrop-blur-2xl shadow-[0_-4px_24px_rgba(0,0,0,0.06)]" data-active-classes="text-primary font-bold"><div class="flex justify-between items-center h-16 px-space-sm max-w-[430px] mx-auto"><a class="flex-1 flex flex-col items-center justify-center gap-space-2xs min-w-[56px] min-h-[44px] text-graphite-mute hover:text-on-surface transition-all active:scale-95" data-path="home-dashboard" href="#"><span class="material-symbols-outlined text-[22px]">home</span><span class="font-label-tab text-label-tab">Home</span></a><a class="flex-1 flex flex-col items-center justify-center gap-space-2xs min-w-[56px] min-h-[44px] text-graphite-mute hover:text-on-surface transition-all active:scale-95" data-path="stage-tuner" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-tab text-label-tab">Tuner</span></a><a class="flex-1 flex flex-col items-center justify-center gap-space-2xs min-w-[56px] min-h-[44px] text-graphite-mute hover:text-on-surface transition-all active:scale-95" data-path="chord-library" href="#"><span class="material-symbols-outlined text-[22px]">grid_on</span><span class="font-label-tab text-label-tab">Chords</span></a><a aria-current="page" class="flex-1 flex flex-col items-center justify-center gap-space-2xs min-w-[56px] min-h-[44px] transition-all active:scale-95 text-primary font-bold" data-path="song-tab-browser" href="#"><span class="material-symbols-outlined text-[22px]">speed</span><span class="font-label-tab text-label-tab">Metronome</span></a><a class="flex-1 flex flex-col items-center justify-center gap-space-2xs min-w-[56px] min-h-[44px] text-graphite-mute hover:text-on-surface transition-all active:scale-95" data-path="rig-jam-hub" href="#"><span class="material-symbols-outlined text-[22px]">groups</span><span class="font-label-tab text-label-tab">Jam Spot</span></a></div></nav>
